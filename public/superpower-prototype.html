<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>سوبر باور — نموذج الواجهة الجديدة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/*
 * Super Power — solid design tokens and components.
 * Light is white, dark is charcoal. No blur, no translucency, no gradients.
 * Every colour is a token; a theme only swaps the tokens.
 */

[data-theme="light"] {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f5f6f7;
  --field: #ffffff;
  --border: #e2e5e9;
  --control: #8c959f;
  --tick: #e2e5e9;
  --ink: #1a1e23;
  --ink-2: #4a535d;
  --ink-3: #66707b;
  --primary: #2b3138;
  --primary-hover: #1a1e23;
  --on-primary: #ffffff;
  --seg-on: #ffffff;
  --select-bg: #eef0f2;
  --meter-on: #2b3138;
  --focus: #1a1e23;
  --bar: #1b1f24;
  --bar-hover: #2b3138;
  --bar-field: #2b3138;
  --bar-line: #454d56;
  --toast-bg: #1a1e23;
  --toast-ink: #ffffff;
  --avatar-bg: #e2e5e9;
  --avatar-ink: #1a1e23;
  --success-bg: #e7f5ec; --success-ink: #0b6b3a; --success-line: #a9d9bd;
  --warning-bg: #fff1dc; --warning-ink: #8a4b00; --warning-line: #f0cf9b;
  --danger-bg: #fce9ea;  --danger-ink: #a51d26;  --danger-line: #efb4b8;
  --info-bg: #e9eff6;    --info-ink: #234a78;    --info-line: #b5c8de;
  --danger-solid: #a51d26;
  --danger-solid-hover: #8a1820;
  --shadow-md: 0 8px 24px rgba(16, 20, 24, 0.12);
  --shadow-lg: 0 20px 48px rgba(16, 20, 24, 0.18);
}

[data-theme="dark"] {
  --bg: #1b1f24;
  --surface: #23282e;
  --surface-2: #2b3138;
  --field: #1b1f24;
  --border: #363d45;
  --control: #6f7984;
  --tick: #363d45;
  --ink: #f1f3f5;
  --ink-2: #c3cad1;
  --ink-3: #9aa4ae;
  --primary: #c9fd14;
  --primary-hover: #dcff5c;
  --on-primary: #14171b;
  --seg-on: #3d454e;
  --select-bg: #2f363e;
  --meter-on: #c9fd14;
  --focus: #c9fd14;
  --bar: #14171b;
  --bar-hover: #23282e;
  --bar-field: #23282e;
  --bar-line: #363d45;
  --toast-bg: #f1f3f5;
  --toast-ink: #1b1f24;
  --avatar-bg: #3d454e;
  --avatar-ink: #f1f3f5;
  --success-bg: #16352a; --success-ink: #6fd99b; --success-line: #245a44;
  --warning-bg: #3a2a12; --warning-ink: #ffc069; --warning-line: #63481f;
  --danger-bg: #3b1c1f;  --danger-ink: #ff8f96;  --danger-line: #6a2e33;
  --info-bg: #1c2c3f;    --info-ink: #9cc3f0;    --info-line: #2f4a69;
  --danger-solid: #c8323c;
  --danger-solid-hover: #d9434d;
  --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.4);
  --shadow-lg: 0 20px 48px rgba(0, 0, 0, 0.5);
}

[data-theme] {
  --volt: #c9fd14;
  --bar-ink: #ffffff;
  --bar-muted: #b9c1ca;
  --font: "IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Alexandria", "IBM Plex Sans Arabic", system-ui, sans-serif;
  --r-sm: 6px;
  --r-md: 8px;
  --r-lg: 12px;
  --r-xl: 14px;
}

/* ---------- base ---------- */

.sp-root {
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  background: var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}
.sp-root *, .sp-root *::before, .sp-root *::after { box-sizing: border-box; }
.sp-root p, .sp-root h1, .sp-root h2, .sp-root h3 { margin: 0; }
.sp-root :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.sp-page { max-width: 1360px; margin-inline: auto; padding: 28px 24px 56px; }
.sp-h1 { font-family: var(--font-display); font-size: 26px; font-weight: 700; line-height: 1.35; }
.sp-h2 { font-size: 17px; font-weight: 600; line-height: 1.5; }
.sp-h3 { font-size: 15px; font-weight: 600; }
.sp-muted { color: var(--ink-2); }
.sp-caption { font-size: 13px; color: var(--ink-3); }
.sp-num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.sp-link { color: var(--ink); font-weight: 600; text-decoration: underline; text-underline-offset: 4px; }
.sp-link:hover { text-decoration-thickness: 2px; }
.sp-ic { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.sp-ic--sm { width: 16px; height: 16px; }
.sp-ic--lg { width: 22px; height: 22px; }

.sp-grid-kpi { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.sp-grid-2-1 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.sp-grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; align-items: start; }
.sp-grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; align-items: start; }

/* ---------- top navigation bar + sub navigation ---------- */

.sp-bar { background: var(--bar); color: var(--bar-ink); display: flex; align-items: center; flex-wrap: wrap; gap: 0 20px; padding: 0 24px; min-height: 60px; }
.sp-bar :focus-visible { outline-color: var(--volt); }
.sp-brand { display: inline-flex; align-items: center; gap: 10px; min-height: 60px; padding-inline-end: 8px; color: #fff; text-decoration: none; font-family: var(--font-display); font-size: 17px; font-weight: 700; white-space: nowrap; }
.sp-bar-nav { display: flex; align-self: stretch; gap: 2px; flex: 1 1 auto; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.sp-bar-nav::-webkit-scrollbar, .sp-sub::-webkit-scrollbar { display: none; }
.sp-bar-link { position: relative; display: inline-flex; align-items: center; gap: 8px; min-height: 60px; padding: 0 14px; border: 0; background: none; color: var(--bar-muted); font: inherit; font-size: 15px; font-weight: 500; white-space: nowrap; cursor: pointer; text-decoration: none; }
.sp-bar-link:hover { color: #fff; background: var(--bar-hover); }
.sp-bar-link.is-current { color: #fff; font-weight: 600; }
.sp-bar-link.is-current::after { content: ""; position: absolute; inset-inline: 14px; bottom: 0; height: 3px; border-radius: 3px 3px 0 0; background: var(--volt); }
.sp-bar-tools { display: flex; align-items: center; gap: 6px; margin-inline-start: auto; }
.sp-bar-search { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; min-width: 170px; padding: 0 12px; border: 1px solid var(--bar-line); border-radius: var(--r-md); background: var(--bar-field); color: var(--bar-muted); font: inherit; font-size: 14px; cursor: pointer; }
.sp-bar-search:hover { border-color: var(--bar-muted); color: #fff; }
.sp-kbd { margin-inline-start: auto; padding: 0 6px; border: 1px solid var(--bar-line); border-radius: 4px; font-family: var(--font); font-size: 12px; line-height: 1.7; color: var(--bar-muted); direction: ltr; }
.sp-bar-chip { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border: 1px solid var(--bar-line); border-radius: var(--r-md); background: transparent; color: #fff; font: inherit; font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer; }
.sp-bar-chip:hover { background: var(--bar-hover); }
.sp-bar-btn { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border: 0; border-radius: var(--r-md); background: transparent; color: var(--bar-muted); cursor: pointer; }
.sp-bar-btn:hover { background: var(--bar-hover); color: #fff; }
.sp-bar-count { position: absolute; top: 5px; inset-inline-end: 4px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 9px; background: var(--volt); color: #1a1e23; font-size: 11px; font-weight: 700; line-height: 18px; text-align: center; }
.sp-bar-user { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; margin-inline-start: 4px; border: 0; border-radius: 50%; background: #fff; color: #1a1e23; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }

.sp-sub { display: flex; gap: 4px; padding: 0 24px; background: var(--surface); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.sp-sub-link { position: relative; display: inline-flex; align-items: center; min-height: 48px; padding: 0 12px; color: var(--ink-2); font-size: 14.5px; font-weight: 500; text-decoration: none; white-space: nowrap; }
.sp-sub-link:hover { color: var(--ink); }
.sp-sub-link.is-current { color: var(--ink); font-weight: 600; }
.sp-sub-link.is-current::after { content: ""; position: absolute; inset-inline: 12px; bottom: -1px; height: 2px; background: var(--ink); }

.sp-crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-3); }
.sp-crumbs a { color: var(--ink-2); text-decoration: none; }
.sp-crumbs a:hover { color: var(--ink); text-decoration: underline; }

/* ---------- buttons ---------- */

.sp-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 18px; border: 1px solid transparent; border-radius: var(--r-md); font: inherit; font-size: 15px; font-weight: 600; white-space: nowrap; text-decoration: none; cursor: pointer; transition: background-color 0.12s, border-color 0.12s; }
.sp-btn--primary { background: var(--primary); color: var(--on-primary); }
.sp-btn--primary:hover { background: var(--primary-hover); }
.sp-btn--secondary { background: var(--surface); color: var(--ink); border-color: var(--control); }
.sp-btn--secondary:hover { background: var(--surface-2); border-color: var(--ink); }
.sp-btn--ghost { background: transparent; color: var(--ink); }
.sp-btn--ghost:hover { background: var(--surface-2); }
.sp-btn--danger { background: var(--danger-solid); color: #fff; }
.sp-btn--danger:hover { background: var(--danger-solid-hover); }
.sp-btn--sm { min-height: 38px; padding: 0 12px; font-size: 14px; }
.sp-btn--lg { min-height: 52px; padding: 0 24px; font-size: 16px; }
.sp-btn--block { width: 100%; }
.sp-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.sp-icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border: 0; border-radius: var(--r-md); background: transparent; color: var(--ink-2); cursor: pointer; }
.sp-icon-btn:hover { background: var(--surface-2); color: var(--ink); }

/* ---------- form controls ---------- */

.sp-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sp-label { font-size: 14px; font-weight: 600; color: var(--ink); }
.sp-input, .sp-select, .sp-textarea { width: 100%; min-height: 44px; padding: 0 12px; border: 1px solid var(--control); border-radius: var(--r-md); background: var(--field); color: var(--ink); font: inherit; font-size: 15px; }
.sp-textarea { padding: 10px 12px; min-height: 88px; resize: vertical; }
.sp-input::placeholder, .sp-textarea::placeholder { color: var(--ink-3); opacity: 1; }
.sp-input:hover, .sp-select:hover, .sp-textarea:hover { border-color: var(--ink-2); }
.sp-input:focus, .sp-select:focus, .sp-textarea:focus { outline: 2px solid var(--focus); outline-offset: 0; border-color: var(--focus); }
.sp-input.is-invalid { border-color: var(--danger-ink); }
.sp-input:disabled { background: var(--surface-2); color: var(--ink-3); cursor: not-allowed; }
.sp-help { font-size: 13px; color: var(--ink-3); }
.sp-error { font-size: 13px; font-weight: 500; color: var(--danger-ink); }
.sp-affix { position: relative; display: flex; }
.sp-affix > .sp-input { padding-inline-end: 44px; }
.sp-affix > span { position: absolute; inset-block: 0; inset-inline-end: 0; width: 44px; display: flex; align-items: center; justify-content: center; color: var(--ink-2); font-weight: 600; pointer-events: none; }
.sp-search { position: relative; display: flex; flex: 1 1 260px; min-width: 0; }
.sp-search > .sp-input { padding-inline-start: 40px; }
.sp-search > svg { position: absolute; inset-block: 0; inset-inline-start: 12px; margin-block: auto; color: var(--ink-3); pointer-events: none; }
.sp-check { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; font-size: 15px; cursor: pointer; }
.sp-check input { width: 18px; height: 18px; margin: 0; accent-color: var(--primary); }
.sp-switch { appearance: none; -webkit-appearance: none; position: relative; flex: none; width: 44px; height: 26px; margin: 0; border-radius: 13px; background: var(--control); cursor: pointer; transition: background-color 0.15s; }
.sp-switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: inset-inline-start 0.15s; }
.sp-switch:checked { background: var(--primary); }
.sp-switch:checked::after { inset-inline-start: 21px; background: var(--on-primary); }

.sp-seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); }
.sp-seg-btn { flex: 1 1 auto; min-height: 38px; padding: 0 14px; border: 0; border-radius: 7px; background: transparent; color: var(--ink-2); font: inherit; font-size: 14px; font-weight: 600; white-space: nowrap; cursor: pointer; }
.sp-seg-btn:hover { color: var(--ink); }
.sp-seg-btn.is-on { background: var(--seg-on); color: var(--ink); box-shadow: 0 0 0 1px var(--border); }
.sp-chip { display: inline-flex; align-items: center; gap: 6px; min-height: 38px; padding: 0 14px; border: 1px solid var(--control); border-radius: 999px; background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; font-weight: 500; white-space: nowrap; cursor: pointer; }
.sp-chip:hover { border-color: var(--ink); }
.sp-chip.is-on { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }

/* ---------- surfaces ---------- */

.sp-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r-lg); min-width: 0; }
.sp-card-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 12px; padding: 14px 20px; border-bottom: 1px solid var(--border); }
.sp-card-body { padding: 20px; }
.sp-card-foot { padding: 12px 20px; border-top: 1px solid var(--border); }

.sp-kpi { display: flex; flex-direction: column; gap: 6px; padding: 18px 20px; }
.sp-kpi-label { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); }
.sp-kpi-value { display: flex; align-items: baseline; gap: 6px; font-family: var(--font-display); font-size: 27px; font-weight: 600; line-height: 1.3; }
.sp-kpi-value small { font-family: var(--font); font-size: 15px; font-weight: 500; color: var(--ink-2); }
.sp-delta { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; }
.sp-delta--up { color: var(--success-ink); }
.sp-delta--down { color: var(--danger-ink); }

.sp-hero-num { display: flex; align-items: baseline; gap: 10px; font-family: var(--font-display); font-size: 52px; font-weight: 700; line-height: 1.2; }
.sp-hero-num small { font-family: var(--font); font-size: 22px; font-weight: 500; color: var(--ink-2); }
.sp-meter { display: flex; gap: 3px; height: 44px; }
.sp-tick { flex: 1 1 0; min-width: 2px; border-radius: 2px; background: var(--tick); }
.sp-tick.is-on { background: var(--meter-on); }
.sp-meter-scale { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--ink-3); }
.sp-facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid var(--border); }
.sp-facts > div { padding: 16px 20px 0; border-inline-start: 1px solid var(--border); }
.sp-facts > div:first-child { padding-inline-start: 0; border-inline-start: 0; }
.sp-fact-value { font-size: 19px; font-weight: 600; }

.sp-progress { height: 8px; border-radius: 99px; background: var(--tick); overflow: hidden; }
.sp-progress > span { display: block; height: 100%; border-radius: 99px; background: var(--meter-on); }
.sp-bars { display: flex; align-items: flex-end; gap: 14px; height: 210px; }
.sp-bar-col { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; min-width: 0; }
.sp-bar-col > i { display: block; width: 100%; max-width: 56px; border-radius: 4px 4px 0 0; background: var(--control); }
.sp-bar-col.is-today > i { background: var(--meter-on); }
.sp-bar-col > b { font-size: 13px; font-weight: 600; }
.sp-bar-col > span { font-size: 13px; color: var(--ink-3); white-space: nowrap; }

.sp-row { display: flex; align-items: center; gap: 12px; padding: 12px 20px; border-bottom: 1px solid var(--border); }
.sp-row:last-child { border-bottom: 0; }
.sp-avatar { display: inline-flex; align-items: center; justify-content: center; flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--avatar-bg); color: var(--avatar-ink); font-size: 13px; font-weight: 700; }

/* ---------- status ---------- */

.sp-badge { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; background: var(--surface-2); color: var(--ink-2); font-size: 13px; font-weight: 600; line-height: 1.7; white-space: nowrap; }
.sp-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.sp-badge--success { background: var(--success-bg); color: var(--success-ink); }
.sp-badge--warning { background: var(--warning-bg); color: var(--warning-ink); }
.sp-badge--danger { background: var(--danger-bg); color: var(--danger-ink); }
.sp-badge--info { background: var(--info-bg); color: var(--info-ink); }

.sp-alert { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); color: var(--ink); font-size: 14.5px; }
.sp-alert > svg { margin-top: 3px; }
.sp-alert--success { background: var(--success-bg); border-color: var(--success-line); color: var(--success-ink); }
.sp-alert--warning { background: var(--warning-bg); border-color: var(--warning-line); color: var(--warning-ink); }
.sp-alert--danger { background: var(--danger-bg); border-color: var(--danger-line); color: var(--danger-ink); }
.sp-alert--info { background: var(--info-bg); border-color: var(--info-line); color: var(--info-ink); }
.sp-toast { display: inline-flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px; background: var(--toast-bg); color: var(--toast-ink); font-size: 14.5px; font-weight: 500; box-shadow: var(--shadow-md); }
.sp-toast button { border: 0; background: none; color: inherit; font: inherit; font-weight: 700; text-decoration: underline; text-underline-offset: 4px; cursor: pointer; min-height: 32px; }

/* ---------- table ---------- */

.sp-table-wrap { overflow-x: auto; }
.sp-table { width: 100%; border-collapse: collapse; font-size: 14.5px; }
.sp-table th { padding: 10px 16px; background: var(--surface-2); border-bottom: 1px solid var(--border); color: var(--ink-2); font-size: 13px; font-weight: 600; text-align: start; white-space: nowrap; }
.sp-table td { padding: 13px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
.sp-table tbody tr:last-child td { border-bottom: 0; }
.sp-table tbody tr:hover { background: var(--surface-2); }
.sp-table tbody tr.is-selected { background: var(--select-bg); box-shadow: inset 3px 0 0 var(--meter-on), inset -3px 0 0 var(--meter-on); }
.sp-table .is-num { text-align: end; font-variant-numeric: tabular-nums; }
.sp-table .is-strong { font-weight: 600; }
.sp-pager { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.sp-pages { display: flex; gap: 4px; }
.sp-page-btn { display: inline-flex; align-items: center; justify-content: center; min-width: 40px; height: 40px; padding: 0 8px; border: 1px solid var(--border); border-radius: var(--r-md); background: var(--surface); color: var(--ink); font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; }
.sp-page-btn:hover { border-color: var(--ink); }
.sp-page-btn.is-current { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }

/* ---------- overlays ---------- */

.sp-modal { width: 100%; max-width: 480px; border: 1px solid var(--border); border-radius: var(--r-xl); background: var(--surface); box-shadow: var(--shadow-lg); }
.sp-modal-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 20px 20px 0; }
.sp-modal-body { padding: 8px 20px 20px; color: var(--ink-2); }
.sp-modal-foot { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--border); }
.sp-menu { min-width: 230px; padding: 6px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface); box-shadow: var(--shadow-md); }
.sp-menu-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 42px; padding: 0 10px; border: 0; border-radius: var(--r-sm); background: none; color: var(--ink); font: inherit; font-size: 14.5px; text-align: start; cursor: pointer; }
.sp-menu-item:hover { background: var(--surface-2); }
.sp-menu-item.is-danger { color: var(--danger-ink); }
.sp-menu-sep { height: 1px; margin: 6px 0; background: var(--border); }
.sp-tooltip { display: inline-block; padding: 6px 10px; border-radius: var(--r-sm); background: var(--toast-bg); color: var(--toast-ink); font-size: 13px; font-weight: 500; }

/* ---------- empty + loading ---------- */

.sp-empty { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 40px 24px; text-align: center; }
.sp-empty-ic { display: flex; align-items: center; justify-content: center; width: 52px; height: 52px; border-radius: 50%; background: var(--surface-2); color: var(--ink-2); }
.sp-skel { border-radius: var(--r-sm); background: var(--tick); animation: sp-pulse 1.4s ease-in-out infinite; }
@keyframes sp-pulse { 50% { opacity: 0.45; } }
@media (prefers-reduced-motion: reduce) {
  .sp-skel { animation: none; }
  .sp-btn, .sp-switch, .sp-switch::after { transition: none; }
}

/* ---------- component sheet ---------- */

.sp-spec { display: flex; flex-direction: column; gap: 16px; padding-top: 28px; border-top: 1px solid var(--border); }
.sp-spec-row { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.sp-swatch { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sp-swatch > i { display: block; height: 64px; border: 1px solid var(--border); border-radius: var(--r-md); }
.sp-swatch b { display: block; font-size: 13px; font-weight: 600; }
.sp-swatch span { display: block; font-size: 12px; color: var(--ink-3); direction: ltr; text-align: end; }
.sp-swatches { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 12px; }

/* ---------- small screens ---------- */

@media (max-width: 1080px) {
  .sp-grid-kpi { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sp-grid-2-1, .sp-grid-2, .sp-grid-3 { grid-template-columns: minmax(0, 1fr); }
  .sp-swatches { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .sp-bar-search { min-width: 0; }
  .sp-hide-md { display: none; }
}
@media (max-width: 860px) {
  .sp-bar { padding: 0 16px; }
  .sp-bar-nav { order: 3; flex-basis: 100%; margin-inline: -8px; }
  .sp-bar-link { min-height: 46px; }
  .sp-sub { padding: 0 8px; }
}
@media (max-width: 640px) {
  .sp-page { padding: 20px 16px 40px; }
  .sp-grid-kpi { grid-template-columns: minmax(0, 1fr); }
  .sp-hero-num { font-size: 40px; }
  .sp-facts { grid-template-columns: minmax(0, 1fr); }
  .sp-facts > div { padding: 12px 0; border-inline-start: 0; border-bottom: 1px solid var(--border); }
  .sp-facts > div:last-child { border-bottom: 0; }
  .sp-bars { gap: 6px; }
  .sp-swatches { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .sp-hide-sm { display: none; }
}

/* ---------- app shell (prototype file) ---------- */

html { background: var(--bg); }
body { margin: 0; }
.sp-root { min-height: 100vh; }
.sp-header { position: sticky; top: 0; z-index: 30; }
.sp-stack { display: flex; flex-direction: column; gap: 24px; }
.sp-between { display: flex; justify-content: space-between; gap: 12px; }
.sp-ltr { direction: ltr; text-align: end; }
.sp-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.sp-top-line { border-top: 1px solid var(--border); }
.sp-page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; }
.sp-page-head .sp-muted { max-width: 68ch; }
.sp-page-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.sp-toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; padding: 16px 20px; }
.sp-row-main { flex: 1 1 auto; min-width: 0; }
.sp-hero { display: flex; flex-direction: column; gap: 22px; padding: 24px; }
.sp-hero-top { display: flex; flex-wrap: wrap; align-items: flex-start; justify-content: space-between; gap: 16px; }
.sp-hero-pct { font-family: var(--font-display); font-size: 30px; font-weight: 600; line-height: 1.3; }
.sp-summary { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border-radius: 10px; background: var(--surface-2); }
.sp-summary-total { padding-top: 8px; border-top: 1px solid var(--border); font-weight: 600; }
.sp-input--lg { min-height: 56px; font-size: 22px; font-weight: 600; }
.sp-brand { border: 0; background: none; cursor: pointer; }
.sp-brand img { display: block; border-radius: 8px; }
.sp-sub-link { border: 0; background: none; font-family: inherit; cursor: pointer; }
button.sp-link { padding: 0; border: 0; background: none; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; min-height: 32px; }
.sp-pop { position: relative; display: inline-flex; }
.sp-pop > .sp-menu { position: absolute; top: calc(100% + 8px); inset-inline-end: 0; z-index: 40; }
.sp-menu-title { padding: 8px 10px 4px; color: var(--ink); }
.sp-backdrop { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(10, 12, 14, 0.62); }
.sp-modal:focus { outline: none; }
.sp-toasts { position: fixed; bottom: 24px; inset-inline: 16px; z-index: 60; display: flex; justify-content: center; pointer-events: none; }
.sp-toasts > * { pointer-events: auto; }
.sp-logo-tile { display: block; border-radius: 20px; }
.sp-logo-lockup { display: flex; align-items: center; gap: 12px; height: 112px; padding: 0 24px; border-radius: 20px; background: #000; color: #fff; font-family: var(--font-display); font-size: 22px; font-weight: 700; }
.sp-logo-lockup img { display: block; }
@media (min-width: 1200px) { .sp-bar { flex-wrap: nowrap; } .sp-bar-tools { flex: none; } }
.sp-check input.sp-switch { width: 44px; height: 26px; }

</style>
