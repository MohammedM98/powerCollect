name: power_collect
version: 1.0.7+8
publish_to: none
description: PowerCollect field app for meter readings and payment collection.

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_mlkit_text_recognition: ^0.17.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  fonts:
    - family: PlexArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
    - family: ElMessiri
      fonts:
        - asset: assets/fonts/ElMessiri[wght].ttf
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria[wght].ttf
    - family: Zain
      fonts:
        - asset: assets/fonts/Zain-Regular.ttf
        - asset: assets/fonts/Zain-Bold.ttf
          weight: 700
        - asset: assets/fonts/Zain-ExtraBold.ttf
          weight: 800
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo[slnt,wght].ttf
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700
    - family: NotoKufi
      fonts:
        - asset: assets/fonts/NotoKufiArabic[wght].ttf
  assets:
    - assets/brand/default.json
    - assets/images/banks/
