<title>powerCollect Glass</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
/* Layout: glass shell over a navy ambient background. Two navigation modes on one data model:
   top bar with section mega-menu, or a collapsible sidebar. Tokens mirror resources/css/theme.css (burgundy brand, graphite neutrals). */
:root{
  color-scheme:dark;
  --bg:#050c1f; --ink:#eaf0ff; --muted:#9db0d3; --faint:#6f82a8;
  --glass-rgb:15 30 66; --glass-a:.6; --blur:18px;
  --line:rgba(140,170,255,.14); --line-hi:rgba(175,200,255,.24);
  --fill:rgba(120,160,255,.07); --fill-2:rgba(120,160,255,.14);
  --ambient:radial-gradient(1300px 720px at 85% -12%,rgba(37,78,170,.34),transparent 62%),radial-gradient(1000px 640px at 0% 112%,rgba(24,58,140,.28),transparent 62%);
  --shadow:0 26px 50px -30px rgba(0,0,0,.95);
  --ok:#3ccf91; --warn:#eaa842; --bad:#f2646f; --info:#6aa5ff;
  --brand-d:91 146 255; --brand-l:37 99 235; --brand-b:47 107 255;
  --brand-rgb:var(--brand-d); --btn-rgb:var(--brand-b);
  --f-body:"IBM Plex Sans Arabic",system-ui,sans-serif; --f-head:"Cairo","IBM Plex Sans Arabic",system-ui,sans-serif;
  --d:1;
}
:root[data-bg="midnight"]{--bg:#040c27;--glass-rgb:14 38 98;--muted:#9fb6e6;--faint:#7088b8;--ambient:radial-gradient(1300px 720px at 85% -12%,rgba(40,95,235,.38),transparent 62%),radial-gradient(1000px 640px at 0% 112%,rgba(30,80,200,.3),transparent 62%)}
:root[data-bg="graphite"]{--bg:#06080c;--ink:#eef1f6;--muted:#a3acbc;--faint:#6e7889;--glass-rgb:20 25 34;--line:rgba(255,255,255,.09);--line-hi:rgba(255,255,255,.16);--fill:rgba(255,255,255,.05);--fill-2:rgba(255,255,255,.09);--ambient:radial-gradient(1300px 720px at 85% -12%,rgba(165,29,38,.22),transparent 62%)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light; --bg:#e3e9f5; --ink:#0f1a33; --muted:#475a7e; --faint:#7184a8; --ambient:radial-gradient(1200px 640px at 85% -12%,rgba(120,160,240,.38),transparent 62%),radial-gradient(900px 600px at 0% 112%,rgba(150,180,240,.32),transparent 62%);
  --glass-rgb:255 255 255; --line:rgba(30,60,120,.12); --line-hi:rgba(255,255,255,.9);
  --fill:rgba(30,60,130,.05); --fill-2:rgba(30,60,130,.09); --shadow:0 24px 40px -28px rgba(30,40,70,.5);
  --ok:#0b8f5a; --warn:#a96a06; --bad:#c62a3a; --info:#1f5fdc; --brand-rgb:var(--brand-l);}}
:root[data-theme="dark"]{color-scheme:dark}
:root[data-theme="light"]{
  color-scheme:light; --bg:#e3e9f5; --ink:#0f1a33; --muted:#475a7e; --faint:#7184a8; --ambient:radial-gradient(1200px 640px at 85% -12%,rgba(120,160,240,.38),transparent 62%),radial-gradient(900px 600px at 0% 112%,rgba(150,180,240,.32),transparent 62%);
  --glass-rgb:255 255 255; --line:rgba(30,60,120,.12); --line-hi:rgba(255,255,255,.9);
  --fill:rgba(30,60,130,.05); --fill-2:rgba(30,60,130,.09); --shadow:0 24px 40px -28px rgba(30,40,70,.5);
  --ok:#0b8f5a; --warn:#a96a06; --bad:#c62a3a; --info:#1f5fdc; --brand-rgb:var(--brand-l);}

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);background-image:var(--ambient);background-repeat:no-repeat;background-attachment:fixed;color:var(--ink);font:500 14px/1.6 var(--f-body);
  padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid rgb(var(--brand-rgb));outline-offset:2px}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
h1,h2,h3{font-family:var(--f-head);margin:0;letter-spacing:0}

/* shell */
.app{position:relative;z-index:1;max-width:1440px;margin-inline:auto;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;align-items:start}
.app[data-nav=side]{grid-template-columns:var(--side-w,272px) minmax(0,1fr)}
.app[data-nav=side][data-rail=on]{--side-w:76px}
.main{min-width:0;display:flex;flex-direction:column;gap:14px}
.glass{background:rgb(var(--glass-rgb)/var(--glass-a));border:1px solid var(--line);border-radius:20px;
  backdrop-filter:blur(var(--blur)) saturate(1.25);-webkit-backdrop-filter:blur(var(--blur)) saturate(1.25);
  box-shadow:inset 0 1px 0 var(--line-hi),var(--shadow)}

/* sidebar */
.side{position:sticky;top:14px;height:calc(100vh - 28px);display:flex;flex-direction:column;padding:12px 10px;overflow:hidden}
.side .scroll{flex:1;overflow-y:auto;overflow-x:hidden;margin-inline:-4px;padding-inline:4px;scrollbar-width:thin}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 12px;min-width:0}
.logo{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;color:#fff;font:800 15px var(--f-head);
  background:linear-gradient(135deg,rgb(var(--brand-d)),rgb(var(--btn-rgb)));box-shadow:0 8px 20px -8px rgb(var(--btn-rgb))}
.brand b{font:800 15px/1.2 var(--f-head);display:block}
.brand small{color:var(--muted);font-size:11px;display:block}
.nav-link{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:12px;color:var(--muted);text-align:start;position:relative;min-height:38px}
.nav-link:hover{background:var(--fill);color:var(--ink)}
.nav-link[aria-current=page]{background:linear-gradient(180deg,rgb(var(--btn-rgb)/.92),rgb(var(--btn-rgb)));color:#fff;box-shadow:0 10px 22px -10px rgb(var(--btn-rgb))}
.nav-link[aria-current=page] svg{color:#fff}
.nav-link svg{flex:none}
.nav-link span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grp{margin-top:6px}
.grp-h{display:flex;align-items:center;gap:8px;width:100%;padding:8px 10px;color:var(--faint);font-size:11.5px;font-weight:700;letter-spacing:.02em;border-radius:10px}
.grp-h:hover{color:var(--ink)}
.grp-h svg.chev{margin-inline-start:auto;transition:transform .25s}
.grp-h[aria-expanded=false] svg.chev{transform:rotate(90deg)}
.grp-b{display:grid;grid-template-rows:1fr;transition:grid-template-rows .3s}
.grp-b[data-open=false]{grid-template-rows:0fr}
.grp-b>div{overflow:hidden;min-height:0;display:flex;flex-direction:column;gap:2px}
.side-foot{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;display:flex;align-items:center;gap:10px}
[data-rail=on] .side .hide-rail,[data-rail=on] .side .nav-link span,[data-rail=on] .side .grp-h span,[data-rail=on] .side .grp-h .chev,[data-rail=on] .side .brand>div{display:none}
[data-rail=on] .side .nav-link,[data-rail=on] .side .grp-h{justify-content:center;padding-inline:0}
[data-rail=on] .side .grp-b[data-open=false]{grid-template-rows:1fr}

/* top bar */
.topwrap{position:sticky;top:14px;z-index:30}
.top{display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:60px}
.top .brand{padding:0 4px 0 8px}
.tnav{display:flex;align-items:center;gap:2px;margin-inline-start:10px;min-width:0;flex-wrap:wrap}
.tbtn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:12px;color:var(--muted);font-weight:600;white-space:nowrap}
.tbtn:hover,.tbtn[aria-expanded=true]{background:var(--fill-2);color:var(--ink)}
.tbtn[data-active=true]{color:#fff;background:linear-gradient(180deg,rgb(var(--btn-rgb)/.92),rgb(var(--btn-rgb)));box-shadow:0 10px 22px -10px rgb(var(--btn-rgb))}
.tbtn svg.chev{transition:transform .2s}.tbtn[aria-expanded=true] svg.chev{transform:rotate(180deg)}
.sp{flex:1}
.ib{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--muted);background:var(--fill);border:1px solid var(--line);flex:none}
.ib:hover{color:var(--ink);background:var(--fill-2)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:12px;background:var(--fill);border:1px solid var(--line)}
.seg button{padding:5px 11px;border-radius:9px;color:var(--muted);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.seg button[aria-pressed=true]{background:rgb(var(--glass-rgb)/.9);color:var(--ink);box-shadow:0 1px 0 var(--line-hi) inset,0 4px 10px -6px rgba(0,0,0,.6)}
:root[data-theme=dark] .seg button[aria-pressed=true]{background:rgba(255,255,255,.14)}
.mega{position:absolute;inset-inline:0;top:calc(100% + 8px);padding:14px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 14px;animation:pop .22s cubic-bezier(.2,.8,.2,1) both;max-width:760px;margin-inline-start:0}
.mega h4{grid-column:1/-1;margin:0 0 4px;padding:0 8px 8px;font:700 13px var(--f-head);border-bottom:1px solid var(--line);color:var(--muted)}
.mlink{display:flex;gap:12px;padding:10px;border-radius:14px;align-items:flex-start}
.mlink:hover{background:var(--fill-2)}
.mlink .ico{width:36px;height:36px;border-radius:11px;flex:none;display:grid;place-items:center;background:var(--fill);border:1px solid var(--line);color:rgb(var(--brand-rgb))}
.mlink b{display:block;font-weight:600}.mlink small{color:var(--muted);font-size:12px;line-height:1.5;display:block}
.mlink[aria-current=page]{background:rgb(var(--brand-rgb)/.14)}
@keyframes pop{from{opacity:0;transform:translateY(-8px) scale(.98)}}

/* page */
.trail{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12.5px;padding:0 6px;flex-wrap:wrap}
.trail b{color:var(--ink);font-weight:600}
.phead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.phead h1{font-size:28px;font-weight:800;line-height:1.25}
.phead p{margin:2px 0 0;color:var(--muted)}
.page{display:flex;flex-direction:column;gap:14px;animation:page-in .55s cubic-bezier(.2,.7,.2,1) both}
@keyframes page-in{from{opacity:0;transform:translateY(14px);filter:blur(6px)}}
.rise{animation:rise .65s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*70ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.985)}}
[data-motion=off] *,[data-motion=off] *::before{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before{animation:none!important;transition:none!important}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:9px 16px;border-radius:12px;font-weight:700;color:#fff;
  background:linear-gradient(180deg,rgb(var(--btn-rgb)/.92),rgb(var(--btn-rgb)));box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 22px -10px rgb(var(--btn-rgb));white-space:nowrap}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.btn.sec{background:var(--fill-2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:10px}
.panel{padding:18px;min-width:0}
.panel h2{font-size:16px;font-weight:700}
.panel .sub{color:var(--muted);font-size:12.5px;margin:2px 0 0}
.ph{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:1.4fr repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{padding:18px;position:relative;overflow:hidden}
.kpi .lbl{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:600;font-size:13px}
.kpi .lbl .ico{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:var(--fill);border:1px solid var(--line)}
.kpi .val{font:800 32px/1.2 var(--f-head);margin-top:14px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.kpi .val small{font:500 14px var(--f-body);color:var(--muted)}
.kpi .hint{color:var(--muted);font-size:12.5px;margin-top:4px}
.kpi.hero{background:linear-gradient(150deg,rgb(var(--brand-rgb)/.32),rgb(var(--glass-rgb)/var(--glass-a)) 60%)}
.kpi.hero .val{font-size:44px}
.kpi.hero::after{content:"";position:absolute;inset-inline:18px;bottom:0;height:2px;background:linear-gradient(90deg,rgb(var(--brand-rgb)),rgba(200,205,215,.8),transparent)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;color:var(--c,var(--muted));background:color-mix(in srgb,var(--c,var(--muted)) 15%,transparent)}
.pill.ok{--c:var(--ok)}.pill.warn{--c:var(--warn)}.pill.bad{--c:var(--bad)}.pill.info{--c:var(--info)}
.chart{width:100%;height:auto;display:block;direction:ltr;overflow:visible}
.chart text{fill:var(--faint);font:11px var(--f-body)}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.4s cubic-bezier(.4,0,.2,1) .15s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.ring-draw{stroke-dasharray:1;stroke-dashoffset:1;animation:ring 1.6s cubic-bezier(.4,0,.2,1) .2s forwards}@keyframes ring{to{stroke-dashoffset:var(--t)}}
.area-in{animation:fade 1s ease .8s both}@keyframes fade{from{opacity:0}}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.row .t small{color:var(--muted);font-size:12px}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center;font:700 12px var(--f-head);background:var(--fill-2);border:1px solid var(--line)}
.bar{height:8px;border-radius:99px;background:var(--fill-2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,rgb(var(--btn-rgb)),rgb(var(--brand-d)));transform-origin:inline-start;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.2s + var(--i,0)*90ms)}
@keyframes grow{from{transform:scaleX(0)}}
.qa{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.qa .qbtn{display:flex;align-items:center;gap:8px;padding:12px;border-radius:14px;background:var(--fill);border:1px solid var(--line);font-weight:600;text-align:start}
.qa .qbtn:hover{background:var(--fill-2);border-color:var(--line-hi)}
.qa svg{color:rgb(var(--brand-rgb))}
.attn{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}.attn:first-of-type{border-top:0}
.attn .dot{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}

/* tables */
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.field{display:flex;align-items:center;gap:8px;padding:0 12px;height:40px;border-radius:12px;background:var(--fill);border:1px solid var(--line);min-width:0}
.field:focus-within{border-color:rgb(var(--brand-rgb)/.6);box-shadow:0 0 0 3px rgb(var(--brand-rgb)/.16)}
.field input,.field select{background:none;border:0;outline:0;min-width:0;width:100%;height:100%}
.field select option{background:#0f1d3d;color:#eaf0ff}
.fl{display:flex;flex-direction:column;gap:6px;min-width:0}.fl>span{font-size:12.5px;color:var(--muted);font-weight:600}
.tblw{overflow-x:auto;border-radius:14px}
table{width:100%;border-collapse:collapse;min-width:640px}
th{font-size:12px;color:var(--faint);text-align:start;font-weight:700;padding:8px 12px;white-space:nowrap}
th button{display:inline-flex;gap:4px;align-items:center;font-weight:700;color:inherit}
td{padding:11px 12px;border-top:1px solid var(--line);white-space:nowrap}
tbody tr{cursor:pointer;transition:background .15s}tbody tr:hover{background:var(--fill)}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--muted)}
.dr-bg{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.4);animation:fade .25s both}
.drawer{position:fixed;z-index:61;top:14px;bottom:14px;inset-inline-end:14px;width:min(420px,calc(100% - 28px));padding:18px;overflow-y:auto;animation:slide .4s cubic-bezier(.2,.8,.2,1) both}
.drawer.start{inset-inline-end:auto;inset-inline-start:14px;width:min(320px,calc(100% - 28px));animation-name:slide2;display:flex;flex-direction:column}
@keyframes slide{from{opacity:0;transform:translateX(calc(-34px * var(--d)))}}
@keyframes slide2{from{opacity:0;transform:translateX(calc(34px * var(--d)))}}

/* forms */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:8px 14px;border-radius:12px;background:var(--fill);border:1px solid var(--line);font-weight:600;color:var(--muted)}
.chip[aria-pressed=true]{color:var(--ink);background:rgb(var(--brand-rgb)/.2);border-color:rgb(var(--brand-rgb)/.5)}
.receipt{padding:20px;border-radius:16px;background:var(--fill);border:1px dashed var(--line-hi);display:flex;flex-direction:column;gap:10px}
.receipt .big{font:800 34px var(--f-head)}
.kv{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:13px}.kv b{color:var(--ink);font-weight:600}

/* boxes + hold */
.box{padding:18px;display:flex;flex-direction:column;gap:12px}
.hold{position:relative;overflow:hidden;padding:10px 16px;border-radius:12px;font-weight:700;background:var(--fill-2);box-shadow:inset 0 0 0 1px var(--line);width:100%;user-select:none;touch-action:none}
.hold::before{content:"";position:absolute;inset:0;background:rgb(var(--btn-rgb)/.75);transform:scaleX(var(--p,0));transform-origin:inline-start}
.hold span{position:relative}
.hold:disabled{opacity:.55;cursor:default}

/* board */
.board-w{overflow-x:auto;padding-bottom:6px}
.board{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:12px;min-width:920px}
.lane{padding:12px;min-height:360px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .2s,background .2s,border-color .2s}
.lane.hot{border-color:rgb(var(--brand-rgb));box-shadow:0 0 0 1px rgb(var(--brand-rgb)),0 0 40px -8px rgb(var(--brand-rgb)/.7)}
.lane h3{font-size:14px;display:flex;align-items:center;gap:8px}.lane h3 em{font:600 11px var(--f-body);font-style:normal;padding:0 8px;border-radius:99px;background:var(--fill-2);color:var(--muted)}
.mb{padding:11px 12px;border-radius:14px;background:rgb(var(--glass-rgb)/.85);border:1px solid var(--line);cursor:grab;touch-action:none;user-select:none;display:flex;flex-direction:column;gap:6px}
:root[data-theme=dark] .mb{background:rgba(24,44,92,.92)}
:root[data-theme=dark]:not([data-bg=graphite]) .side{background:linear-gradient(180deg,rgba(34,72,165,.5),rgb(var(--glass-rgb)/var(--glass-a)) 55%)}
.mb.drag{opacity:.25}.mb.ghost{position:fixed;z-index:90;margin:0;pointer-events:none;cursor:grabbing;box-shadow:0 30px 60px -10px rgba(0,0,0,.7),0 0 0 1px var(--line-hi)}
.mb.land{animation:land .5s cubic-bezier(.2,1.4,.4,1)}@keyframes land{from{transform:scale(.88);opacity:0}}
.empty{border:1.5px dashed var(--line-hi);border-radius:14px;display:grid;place-items:center;color:var(--faint);min-height:100px}
.toast{position:fixed;inset-inline:0;margin-inline:auto;width:max-content;max-width:calc(100% - 32px);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:100;
  display:flex;gap:16px;align-items:center;padding:11px 16px;border-radius:14px;background:#eef2f8;color:#0b1220;font-weight:700;box-shadow:0 24px 44px -12px rgba(0,0,0,.7);animation:toast .45s cubic-bezier(.2,1.3,.4,1) both}
.toast button{color:#a51d26;font-weight:800}@keyframes toast{from{opacity:0;transform:translateY(30px) scale(.94)}}
.skel{height:12px;border-radius:8px;background:linear-gradient(90deg,var(--fill),var(--fill-2),var(--fill));background-size:200% 100%;animation:sh 1.6s linear infinite}@keyframes sh{to{background-position:-200% 0}}
.swatch{width:38px;height:38px;border-radius:12px;border:2px solid transparent;background:rgb(var(--c))}.swatch[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 3px var(--bg)}
input[type=range]{width:100%;accent-color:rgb(var(--btn-rgb))}
.note{color:var(--faint);font-size:12px;text-align:center;padding:8px 0 4px}

@media (max-width:1100px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}

/* video-style layout: stat strip, chart studio, goal ring, live bars, split bar, underline tabs, board cards */
.dash{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:14px;align-items:start}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.stat{padding:2px 16px;border-inline-start:1px solid var(--line);min-width:0}
.stat:first-child{border:0;padding-inline-start:2px}
.stat .lbl{color:var(--muted);font-size:12.5px;font-weight:600}
.stat .big{font:800 28px/1.25 var(--f-head);display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.stat .big small{font:500 13px var(--f-body);color:var(--muted)}
.stat .foot{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;margin-top:2px;flex-wrap:wrap}
.chart-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0 6px}
.chart-h h2{font-size:15px;font-weight:700}

.ringbox{display:grid;place-items:center;position:relative;width:104px;height:104px;margin:6px auto 12px}
.ringbox b{position:absolute;text-align:center;font:800 20px/1 var(--f-head)}
.ringbox small{display:block;font:500 10px var(--f-body);color:var(--muted);margin-top:4px}
.live{display:flex;align-items:flex-end;gap:3px;height:48px;margin:8px 0}

.split{display:flex;height:8px;border-radius:99px;overflow:hidden;gap:2px;margin:12px 0}
.split i{display:block;height:100%;transform-origin:inline-start;animation:grow 1.1s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(.3s + var(--i,0)*120ms)}
.spark{width:64px;height:24px;direction:ltr;margin-inline-start:auto}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{padding:8px 0;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;gap:6px;align-items:center}
.tabs button[aria-selected=true]{color:var(--ink);border-color:rgb(var(--brand-rgb))}
.tabs .cnt{font-size:10.5px;padding:0 6px;border-radius:99px;background:var(--fill-2);color:var(--muted)}
.lane h3 i.dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.lane .note{margin:0 0 4px;color:var(--faint);font-size:12px}
.mb .oh{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.mb .oh .id{font-family:ui-monospace,Menlo,monospace;color:var(--ink)}
.mb .who{display:flex;align-items:center;gap:8px;font-weight:700}
.mb .who .av{width:26px;height:26px;font-size:10.5px}
.mb .items{color:var(--muted);font-size:12.5px}
.mb .of{display:flex;justify-content:space-between;align-items:center;font-weight:700}
.tag{font-size:10.5px;font-weight:600;padding:1px 8px;border-radius:7px;background:var(--fill-2);color:var(--muted)}
.word{display:inline-block;animation:word .6s cubic-bezier(.2,1.3,.4,1) both;animation-delay:calc(.1s + var(--w)*70ms)}
@keyframes word{from{opacity:0;transform:translateY(55%) rotate(4deg)}}
.leaving{animation:out .2s ease both}@keyframes out{to{opacity:0;transform:translateY(-10px);filter:blur(6px)}}

const reduced=()=>document.documentElement.dataset.motion==='off'||(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function useMedia(q){const [m,setM]=useState(()=>matchMedia(q).matches);useEffect(()=>{const mq=matchMedia(q),f=()=>setM(mq.matches);mq.addEventListener('change',f);return()=>mq.removeEventListener('change',f)},[q]);return m}
const ToastCtx=createContext(()=>{});const useToast=()=>useContext(ToastCtx);
function ToastHost({children}){
  const [t,setT]=useState(null);const tm=useRef();
  const push=useCallback((msg,undo,label='تراجع')=>{clearTimeout(tm.current);setT({msg,undo,label,k:Date.now()});tm.current=setTimeout(()=>setT(null),4500)},[]);
  return <ToastCtx.Provider value={push}>{children}{t&&<div key={t.k} className="toast" role="status"><span>{t.msg}</span>{t.undo&&<button onClick={()=>{t.undo();setT(null)}}>{t.label}</button>}</div>}</ToastCtx.Provider>
}

function CountUp({value,decimals=0}){ /* ↔ CountUp.jsx */
  const [v,setV]=useState(()=>reduced()?value:0);
  useEffect(()=>{if(reduced()){setV(value);return}let f,t0=performance.now();const tick=n=>{const p=Math.min((n-t0)/1200,1);setV(value*(1-Math.pow(1-p,3)));if(p<1)f=requestAnimationFrame(tick)};f=requestAnimationFrame(tick);return()=>cancelAnimationFrame(f)},[value]);
  return <span className="num">{fmt(v,decimals)}</span>
}
function Segmented({options,value,onChange,label}){ /* ↔ SegmentedTabs.jsx */
  return <div className="seg" role="group" aria-label={label}>{options.map(o=><button key={o.v} aria-pressed={value===o.v} onClick={()=>onChange(o.v)}>{o.icon&&<Icon name={o.icon} size={15}/>}{o.l}</button>)}</div>
}
function Kpi({icon,label,value,unit,hint,badge,hero,i=0,decimals=0}){ /* ↔ KpiTile.jsx */
  return <div className={'glass kpi rise'+(hero?' hero':'')} style={{'--i':i}}>
    <div className="lbl"><span className="ico"><Icon name={icon} size={17}/></span>{label}{badge&&<span style={{marginInlineStart:'auto'}}>{badge}</span>}</div>
    <div className="val"><CountUp value={value} decimals={decimals}/>{unit&&<small>{unit}</small>}</div>
    {hint&&<div className="hint">{hint}</div>}

function AreaChart({data,labels,prev}){ /* ↔ Charts/Sparkline.jsx + BarChart.jsx */
  const W0=44,W1=590,base=186,H=150,max=Math.ceil(Math.max(...data,...(prev||[0]))/4)*4,n=data.length;
  const pts=data.map((v,i)=>[W0+i*(W1-W0)/(n-1),base-v/max*H]);
  let d='M'+pts[0].join(',');for(let i=1;i<n;i++){const a=pts[i-1],b=pts[i],mx=(a[0]+b[0])/2;d+=` C${mx},${a[1]} ${mx},${b[1]} ${b[0]},${b[1]}`}
  const last=pts[n-1],step=Math.max(1,Math.ceil(n/7));
  const mk=arr=>{const q=arr.map((v,i)=>[W0+i*(W1-W0)/(n-1),base-v/max*H]);let t='M'+q[0].join(',');for(let i=1;i<n;i++){const a=q[i-1],b=q[i],mx=(a[0]+b[0])/2;t+=` C${mx},${a[1]} ${mx},${b[1]} ${b[0]},${b[1]}`}return t};
  return <svg className="chart" viewBox="0 0 620 214" role="img" aria-label="اتجاه التحصيل">
    <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stopColor="rgb(var(--brand-rgb))" stopOpacity=".5"/><stop offset="1" stopColor="rgb(var(--brand-rgb))" stopOpacity="0"/></linearGradient></defs>
    {[0,1,2,3,4].map(i=>{const y=base-i*H/4;return <g key={i}><line x1={W0} x2={W1} y1={y} y2={y} stroke="var(--line)"/><text x={W0-8} y={y+4} textAnchor="end">{fmt(max/4*i)}k</text></g>})}
    {labels.map((l,i)=>i%step===0&&<text key={i} x={pts[i][0]} y={206} textAnchor="middle">{l}</text>)}
    {prev&&<path d={mk(prev)} fill="none" stroke="var(--faint)" strokeWidth="1.6" strokeDasharray="4 5"/>}
    <path className="area-in" d={`${d} L${W1},${base} L${W0},${base}Z`} fill="url(#ag)"/>
    <path className="draw" pathLength="1" d={d} fill="none" stroke="rgb(var(--brand-rgb))" strokeWidth="2.6" strokeLinecap="round"/>
    <circle className="area-in" cx={last[0]} cy={last[1]} r="5" fill="var(--ink)" stroke="rgb(var(--brand-rgb))" strokeWidth="3"/>
  </svg>
}
function HoldToConfirm({label,onDone,disabled}){ /* ↔ HoldToConfirm.jsx */

function MoveBoard({lanes,items,setItems,card}){ /* ↔ new Components/MoveBoard.jsx — drag with ghost (scale 1.04, tilt), hot lane, undo toast */
  const toast=useToast();
  function down(e,it){
    if(e.button>0)return;const el=e.currentTarget;const x0=e.clientX,y0=e.clientY,r=el.getBoundingClientRect();let on=false,ghost=null,over=null;
    el.setPointerCapture(e.pointerId);
    const move=ev=>{const dx=ev.clientX-x0,dy=ev.clientY-y0;
      if(!on){if(Math.hypot(dx,dy)<6)return;on=true;ghost=el.cloneNode(true);ghost.classList.add('ghost');ghost.style.cssText+=`left:${r.left}px;top:${r.top}px;width:${r.width}px`;document.body.appendChild(ghost);el.classList.add('drag');
        if(!reduced())ghost.animate([{transform:'scale(1) rotate(0)'},{transform:'scale(1.04) rotate(-2deg)'}],{duration:260,easing:'cubic-bezier(.2,1.6,.4,1)',fill:'forwards'})}
      ghost.style.translate=`${dx}px ${dy}px`;
      const u=document.elementFromPoint(ev.clientX,ev.clientY),l=u&&u.closest('.lane'),id=l?l.dataset.lane:null;
      if(id!==over){document.querySelectorAll('.lane').forEach(n=>n.classList.toggle('hot',n.dataset.lane===id));over=id}};
    const up=()=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);document.querySelectorAll('.lane').forEach(n=>n.classList.remove('hot'));
      if(!on)return;
      if(over&&over!==it.l){const from=it.l;setItems(a=>a.map(x=>x.id===it.id?{...x,l:over}:x));ghost.remove();
        requestAnimationFrame(()=>{const n=document.querySelector(`.mb[data-id="${it.id}"]`);if(n)n.classList.add('land')});
        toast(`${it.id} · ${lanes.find(l=>l.id===over).n}`,()=>setItems(a=>a.map(x=>x.id===it.id?{...x,l:from}:x)))}
      else{ghost.animate([{opacity:1},{opacity:0}],{duration:200}).onfinish=()=>ghost.remove();el.classList.remove('drag')}};
    el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  }
  return <div className="board-w"><div className="board">{lanes.map((l,i)=>{const list=items.filter(x=>x.l===l.id);return <section key={l.id} data-lane={l.id} className="lane glass rise" style={{'--i':i}}>
    <h3><i className="dot" style={{'--c':l.c}}/>{l.n}<em className="num">{list.length}</em></h3>{l.note&&<p className="note">{l.note}</p>}
    {list.map(it=><article key={it.id} data-id={it.id} className="mb" onPointerDown={e=>down(e,it)}>{card(it)}</article>)}
    {!list.length&&<div className="empty">أفلت هنا</div>}</section>})}</div></div>
}

}

/* ───────────── app ───────────── */
const DEF={nav:'side',theme:matchMedia('(prefers-color-scheme: light)').matches?'light':'dark',glass:.6,blur:18,accent:'azure',bg:'navy',motion:true,rail:false};
function App(){
  const [prefs,setPrefs]=useState(()=>({...DEF,...store.get('prefs2',{})}));
  const set=useCallback(c=>setPrefs(p=>({...p,...c})),[]);
  const [route,setRoute]=useState(()=>{const h=location.hash.slice(1);return P[h]?h:'dashboard'});
  const mobile=useMedia('(max-width: 900px)');const [drawer,setDrawer]=useState(false);const [leaving,setLeaving]=useState(false);
  useEffect(()=>{const f=()=>{const h=location.hash.slice(1),n=P[h]?h:'dashboard';const go=()=>{setRoute(n);setLeaving(false);setDrawer(false);window.scrollTo({top:0})};if(reduced()){go();return}setLeaving(true);setTimeout(go,200)};addEventListener('hashchange',f);return()=>removeEventListener('hashchange',f)},[]);
  useEffect(()=>{const r=document.documentElement,a=ACCENTS[prefs.accent]||ACCENTS.azure;r.dir='rtl';r.lang='ar';r.dataset.theme=prefs.theme;r.dataset.bg=prefs.bg;r.dataset.motion=prefs.motion?'on':'off';
    r.style.setProperty('--glass-a',prefs.glass);r.style.setProperty('--blur',prefs.blur+'px');r.style.setProperty('--brand-d',a.d);r.style.setProperty('--brand-l',a.l);r.style.setProperty('--brand-b',a.b);store.set('prefs2',prefs)},[prefs]);
  useEffect(()=>{const k=e=>{if(e.key==='Escape')setDrawer(false)};addEventListener('keydown',k);return()=>removeEventListener('keydown',k)},[]);
  const mode=prefs.nav;const sidebar=mode==='side'&&!mobile;
  let page;
  switch(route){case 'dashboard':page=<Dashboard/>;break;case 'subscriptions':page=<Subscribers/>;break;case 'payments':page=<Payments/>;break;case 'payments-cash-boxes':page=<CashBoxes/>;break;case 'reading-cycles':page=<ReadingPage/>;break;case 'collection-board':page=<CollectionPage/>;break;case 'branch-performance':page=<BranchPerf/>;break;case 'settings-appearance':page=<Appearance prefs={prefs} set={set}/>;break;default:page=<Placeholder id={route}/>}
  return <ToastHost>
    <div className="app" data-nav={sidebar?'side':'top'} data-rail={sidebar&&prefs.rail?'on':'off'}>
      {sidebar&&<Sidebar route={route} rail={prefs.rail} onToggleRail={()=>set({rail:!prefs.rail})}/>}
      <div className="main">
        <TopBar route={route} mode={mode} setMode={m=>set({nav:m})} theme={prefs.theme} setTheme={t=>set({theme:t})} mobile={mobile} onMenu={()=>setDrawer(true)}/>
        {route!=='dashboard'&&<Trail route={route}/>}
        <div key={route} className={leaving?'leaving':''}>{page}</div>
        <div className="note">نموذج أولي ببيانات تجريبية · نفس صفحات سوبر باور الحقيقية وأسماء أقسامها</div>
      </div>
    </div>
    {mobile&&drawer&&<><div className="dr-bg" onClick={()=>setDrawer(false)}/><Sidebar drawer route={route} rail={false} onNavigate={()=>setDrawer(false)}/></>}
  </ToastHost>
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
